{{/* 테마 원본 복사본. 태그 링크 앞의 / 제거로 하위 경로 유지 (Claude 작성 → 학생 검토 후 적용) */}}
{{ $limit := default 0 .limit }}
{{ if .Params.tags }}
  <div class="post-tags">
    {{ if gt $limit 0 }}
      {{ range first $limit .Params.tags }}
        <a
          href="{{ "tags/" | relLangURL }}{{ . | urlize }}"
          class="post-tag"
          onclick="event.stopPropagation();"
          >{{ . }}</a
        >
      {{ end }}
    {{ else }}
      {{ range .Params.tags }}
        <a
          href="{{ "tags/" | relLangURL }}{{ . | urlize }}"
          class="post-tag"
          onclick="event.stopPropagation();"
          >{{ . }}</a
        >
      {{ end }}
    {{ end }}
  </div>
{{ end }}
